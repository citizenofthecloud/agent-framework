[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "citizenofthecloud-agentframework"
version = "0.1.0"
description = "Microsoft Agent Framework integration for Citizen of the Cloud identity protocol"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "William Kilpatrick", email = "william.kilpatrick@gmail.com"},
]
keywords = [
    "microsoft", "agent-framework", "autogen", "semantic-kernel",
    "ai-agents", "identity", "verification", "trust", "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "citizenofthecloud>=0.1.0",
    "agent-framework>=0.1.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://citizenofthecloud.com"
Documentation = "https://citizenofthecloud.com/docs"
Repository = "https://github.com/citizenofthecloud/agent-framework"
Issues = "https://github.com/citizenofthecloud/agent-framework/issues"

[tool.setuptools.packages.find]
include = ["citizenofthecloud_agentframework*"]
